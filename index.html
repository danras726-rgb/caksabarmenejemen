<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Firebase SDK (Mocked for environment, uses global inject if real) -->

        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, updateDoc, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.FirebaseLib = { initializeApp, getFirestore, collection, onSnapshot, addDoc, updateDoc, doc, setDoc, getAuth, signInAnonymously, onAuthStateChanged };

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
                    colors: { brand: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' } }
                }
            }
        }
    </script>

    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f8fafc; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; border: 2px solid #f8fafc; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        input[type="date"]::-webkit-calendar-picker-indicator { opacity: 0.6; cursor: pointer; transition: 0.2s; }
        input[type="date"]::-webkit-calendar-picker-indicator:hover { opacity: 1; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        /* Custom Toggle Switch Styles */
        .toggle-checkbox:checked { right: 0; border-color: #68D391; }
        .toggle-checkbox:checked + .toggle-label { background-color: #10B981; }
    </style>
</head>
<body class="bg-slate-50 text-slate-700 selection:bg-brand-500/20 overflow-hidden font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;

        // --- KOMPONEN IKON ---
        const Icon = ({ path, size=20, className="" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} dangerouslySetInnerHTML={{__html: path}} />
        );

        const Icons = {
            LayoutDashboard: (props) => <Icon path='<rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>' {...props} />,
            ArrowRightLeft: (props) => <Icon path='<path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/>' {...props} />,
            FileText: (props) => <Icon path='<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>' {...props} />,
            Utensils: (props) => <Icon path='<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>' {...props} />,
            CalendarDays: (props) => <Icon path='<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/>' {...props} />,
            Beef: (props) => <Icon path='<circle cx="12.5" cy="8.5" r="2.5"/><path d="M12.5 2a6.5 6.5 0 0 0-6.22 4.6c-1.1 3.13-.78 3.9-3.18 6.08A3 3 0 0 0 5 18c4 0 8.4-1.8 11.4-4.3A6.5 6.5 0 0 0 12.5 2Z"/><path d="m18.5 6 2.19 4.5a6.48 6.48 0 0 1 .31 2 6.49 6.49 0 0 1-2.6 5.2C16.9 19 14.7 22 12 22a3 3 0 0 1-2.68-1.66L8.4 19.5"/>' {...props} />,
            Plus: (props) => <Icon path='<path d="M5 12h14"/><path d="M12 5v14"/>' {...props} />,
            TrendingUp: (props) => <Icon path='<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>' {...props} />,
            TrendingDown: (props) => <Icon path='<polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/>' {...props} />,
            DollarSign: (props) => <Icon path='<line x1="12" x2="12" y1="2" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>' {...props} />,
            Briefcase: (props) => <Icon path='<rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>' {...props} />,
            Search: (props) => <Icon path='<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>' {...props} />,
            Bell: (props) => <Icon path='<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>' {...props} />,
            User: (props) => <Icon path='<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>' {...props} />,
            CheckCircle: (props) => <Icon path='<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/>' {...props} />,
            Clock: (props) => <Icon path='<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>' {...props} />,
            LogOut: (props) => <Icon path='<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>' {...props} />,
            X: (props) => <Icon path='<path d="M18 6 6 18"/><path d="m6 6 12 12"/>' {...props} />,
            Trash2: (props) => <Icon path='<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/>' {...props} />,
            Activity: (props) => <Icon path='<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>' {...props} />,
            Printer: (props) => <Icon path='<polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/>' {...props} />,
            ChevronRight: (props) => <Icon path='<path d="m9 18 6-6-6-6"/>' {...props} />,
            MoreHorizontal: (props) => <Icon path='<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>' {...props} />,
            BarChart3: (props) => <Icon path='<path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>' {...props} />,
            Package: (props) => <Icon path='<line x1="16.5" x2="7.5" y1="9.4" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" x2="12" y1="22.08" y2="12"/>' {...props} />,
            Menu: (props) => <Icon path='<line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/>' {...props} />,
            Settings: (props) => <Icon path='<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>' {...props} />,
            Eye: (props) => <Icon path='<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>' {...props} />,
            PenTool: (props) => <Icon path='<path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/>' {...props} />
        };

        const hashPassword = async (password) => {
            const msgUint8 = new TextEncoder().encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        };

        const today = new Date();
        const startOfDay = new Date(today.getFullYear(), today.getMonth(), today.getDate());
        const startOfWeek = new Date(today.setDate(today.getDate() - today.getDay() + (today.getDay() === 0 ? -6 : 1))); 
        startOfWeek.setHours(0,0,0,0);
        const startOfMonth = new Date(today.getFullYear(), today.getMonth(), 1);
        const startOfYear = new Date(today.getFullYear(), 0, 1);

        const formatDate = (dateString, includeTime = false) => {
            if (!dateString) return '-';
            const options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
            if(includeTime) { options.hour = '2-digit'; options.minute = '2-digit'; }
            return new Date(dateString).toLocaleDateString('id-ID', options);
        };

        const formatRupiah = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka || 0);
        const formatRibuanInput = (value) => String(value).replace(/\D/g, '').replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        const unformatRibuan = (value) => parseInt(String(value).replace(/\./g, ''), 10) || 0;

        const defaultAuth = {
            admin: { user: 'owner', pass: 'a665a45920422f9d417e4867efdc4fb8a04a1f3fff1fa07e998e86f7f7a27ae3' },
            pos: { user: 'pegawai', pass: 'a665a45920422f9d417e4867efdc4fb8a04a1f3fff1fa07e998e86f7f7a27ae3' }
        };

        const Toast = ({ message, isVisible }) => (
            <div className={`fixed top-5 right-5 z-50 transition-all duration-300 transform ${isVisible ? 'translate-y-0 opacity-100' : '-translate-y-10 opacity-0 pointer-events-none'}`}>
                <div className="bg-white border border-slate-100 text-slate-800 px-6 py-3 rounded-2xl shadow-xl shadow-slate-200/50 flex items-center space-x-3">
                    <Icons.CheckCircle size={20} className="text-emerald-500" />
                    <span className="font-medium text-sm tracking-wide">{message}</span>
                </div>
            </div>
        );

        const LoginScreen = ({ onLogin, showToast, authCredentials }) => {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');

            const handleLogin = async (e) => {
                e.preventDefault();
                const creds = authCredentials || defaultAuth;
                const hashedInput = await hashPassword(password);

                if (username === creds.admin.user && hashedInput === creds.admin.pass) {
                    onLogin({ name: 'Bpk. Owner', role: 'admin' });
                    showToast('Berhasil login sebagai Owner');
                } else if (username === creds.pos.user && hashedInput === creds.pos.pass) {
                    onLogin({ name: 'Kasir Sate', role: 'pos' });
                    showToast('Berhasil login sebagai Pegawai');
                } else {
                    showToast('Username atau password salah!');
                }
            };

            return (
                <div className="flex-1 flex items-center justify-center bg-slate-50 p-4">
                    <div className="bg-white w-full max-w-md rounded-3xl border border-slate-200 shadow-xl shadow-slate-200/50 p-8 animate-fade-in relative overflow-hidden">
                        <div className="absolute top-0 right-0 w-32 h-32 bg-brand-50 rounded-full blur-3xl pointer-events-none"></div>
                        <div className="text-center mb-8 relative z-10">
                            <div className="mx-auto w-20 h-20 bg-brand-100 rounded-full flex items-center justify-center mb-4"><Icons.Briefcase size={32} className="text-brand-600"/></div>
                            <h1 className="text-2xl font-black tracking-tight text-slate-800">CAKSABAR</h1>
                            <p className="text-sm text-slate-500 mt-2">Sistem Manajemen Terkoneksi Cloud</p>
                        </div>
                        <form onSubmit={handleLogin} className="space-y-5 relative z-10">
                            <div>
                                <label className="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Username</label>
                                <div className="relative">
                                    <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><Icons.User size={18} className="text-slate-400" /></div>
                                    <input type="text" value={username} onChange={e => setUsername(e.target.value)} required placeholder="Masukkan username" className="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 outline-none text-sm font-medium" />
                                </div>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Password</label>
                                <div className="relative">
                                    <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><Icons.Briefcase size={18} className="text-slate-400" /></div>
                                    <input type="password" value={password} onChange={e => setPassword(e.target.value)} required placeholder="Masukkan kata sandi" className="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 outline-none text-sm font-medium" />
                                </div>
                            </div>
                            <button type="submit" className="w-full py-3.5 bg-brand-600 hover:bg-brand-700 text-white rounded-2xl font-bold transition-all shadow-md mt-2">Masuk</button>
                        </form>
                    </div>
                </div>
            );
        };

        const Beranda = ({ stats, transactions, setTab, orders }) => {
            // Adapted Beranda to read from the new daily records primarily for visual graphs, 
            // but keeping basic layout.
            const chartDataDynamic = useMemo(() => {
                const data = [];
                const days = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
                let maxAmount = 0;
                for (let i = 6; i >= 0; i--) {
                    const d = new Date(); d.setDate(d.getDate() - i); d.setHours(0, 0, 0, 0);
                    const nextDay = new Date(d); nextDay.setDate(d.getDate() + 1);
                    const dayTransactions = transactions.filter(t => {
                        const tDate = new Date(t.date);
                        return tDate >= d && tDate < nextDay && t.type === 'laporan_harian';
                    });
                    const totalPemasukan = dayTransactions.reduce((sum, t) => sum + (t.pendapatan || 0), 0);
                    if (totalPemasukan > maxAmount) maxAmount = totalPemasukan;
                    data.push({ label: days[d.getDay()], fullDate: d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' }), amount: totalPemasukan });
                }
                return data.map(item => ({ ...item, heightPercent: maxAmount > 0 ? Math.max((item.amount / maxAmount) * 100, item.amount > 0 ? 3 : 0) : 0 }));
            }, [transactions]);

            return (
                <div className="space-y-8 animate-fade-in pb-10">
                    <div className="flex justify-between items-end gap-4">
                        <div>
                            <h2 className="text-3xl font-bold text-slate-800 tracking-tight">Dashboard Utama</h2>
                            <p className="text-sm text-slate-500 mt-1">Ringkasan performa finansial berdasarkan Input Harian.</p>
                        </div>
                        <button onClick={() => setTab('input_harian')} className="bg-brand-600 hover:bg-brand-700 text-white px-5 py-2.5 rounded-full text-sm font-semibold flex items-center shadow-lg">
                            <Icons.Plus size={16} className="mr-2"/> Input Harian
                        </button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5">
                        {[
                            { title: 'Pendapatan Hari Ini', value: stats.hariIni.omset, icon: Icons.TrendingUp, color: 'text-emerald-600', bgIcon: 'bg-emerald-50 border-emerald-100' },
                            { title: 'Total Pengeluaran', value: stats.hariIni.pengeluaran, icon: Icons.TrendingDown, color: 'text-rose-600', bgIcon: 'bg-rose-50 border-rose-100' },
                            { title: 'Sisa Saldo Hari Ini', value: stats.hariIni.laba, icon: Icons.DollarSign, color: 'text-brand-600', bgIcon: 'bg-brand-50 border-brand-100' },
                            { title: 'Laba Bersih Bulan Ini', value: stats.bulanIni.laba, icon: Icons.Activity, color: 'text-sky-600', bgIcon: 'bg-sky-50 border-sky-100' }
                        ].map((item, idx) => (
                            <div key={idx} className="bg-white rounded-3xl border border-slate-100 shadow-sm p-6 relative overflow-hidden group">
                                <div className="flex justify-between items-start mb-6">
                                    <div className="flex items-center space-x-3"><div className={`p-2.5 rounded-xl border ${item.bgIcon}`}><item.icon size={18} className={item.color} /></div><p className="text-slate-500 text-sm font-medium">{item.title}</p></div>
                                </div>
                                <h3 className="text-2xl font-bold text-slate-800 tracking-tight">{formatRupiah(item.value)}</h3>
                            </div>
                        ))}
                    </div>

                    <div className="bg-white rounded-3xl border border-slate-100 shadow-sm p-7">
                        <div className="flex justify-between items-start mb-6">
                            <div><h3 className="text-lg font-bold text-slate-800 flex items-center"><Icons.BarChart3 size={18} className="mr-2 text-brand-500"/> Grafik Pendapatan</h3><p className="text-xs text-slate-500 mt-1">7 hari terakhir (dari Laporan Harian)</p></div>
                        </div>
                        <div className="flex items-end space-x-2 md:space-x-4 h-48 mt-4 relative w-full pt-4">
                            <div className="absolute inset-0 flex flex-col justify-between z-0 pb-6"><div className="border-b border-slate-100 w-full"></div><div className="border-b border-slate-100 w-full"></div><div className="border-b border-slate-100 w-full"></div></div>
                            {chartDataDynamic.map((item, i) => (
                                <div key={i} className="flex-1 flex flex-col justify-end h-full relative z-10 group cursor-pointer pb-6">
                                    <div className="absolute bottom-full mb-2 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white text-xs px-3 py-2 rounded-xl opacity-0 group-hover:opacity-100 transition-all shadow-xl whitespace-nowrap z-20"><p>{item.fullDate}</p><p className="font-bold text-emerald-400">{formatRupiah(item.amount)}</p></div>
                                    <div className="relative mx-1 bg-gradient-to-t from-brand-200 to-brand-500 rounded-t-lg" style={{ height: `${item.heightPercent}%` }}></div>
                                    <div className="absolute bottom-0 inset-x-0 text-center text-xs text-slate-500">{item.label}</div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const InputHarian = ({ addTransaction, showToast }) => {
            const OPEX = 295750;
            const TANGGUNGAN = 419562;

            const [form, setForm] = useState({
                pendapatan: '',
                useOpex: true,
                useTanggungan: true,
                tambahan: '',
                catatan: ''
            });

            // Live Calculations
            const valPendapatan = unformatRibuan(form.pendapatan);
            const valTambahan = unformatRibuan(form.tambahan);
            const valOpex = form.useOpex ? OPEX : 0;
            const valTanggungan = form.useTanggungan ? TANGGUNGAN : 0;
            
            const totalTetap = valOpex + valTanggungan;
            const totalPengeluaran = totalTetap + valTambahan;
            const sisaSaldo = valPendapatan - totalPengeluaran;

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!valPendapatan && !valTambahan) return showToast('Harap isi nominal pendapatan atau pengeluaran tambahan.');

                const newRecord = {
                    type: 'laporan_harian',
                    date: new Date().toISOString(),
                    pendapatan: valPendapatan,
                    opex: valOpex,
                    tanggungan: valTanggungan,
                    pengeluaranTambahan: valTambahan,
                    totalPengeluaran: totalPengeluaran,
                    sisaSaldo: sisaSaldo,
                    desc: form.catatan || 'Laporan Tutup Kasir Harian'
                };

                addTransaction(newRecord);
                showToast('Laporan Harian berhasil disimpan ke Firebase!');
                
                // Reset form
                setForm({ pendapatan: '', useOpex: true, useTanggungan: true, tambahan: '', catatan: '' });
            };

            return (
                <div className="space-y-6 animate-fade-in pb-10">
                    <div>
                        <h2 className="text-2xl font-bold text-slate-800 tracking-tight">Input Data Harian</h2>
                        <p className="text-sm text-slate-500 mt-1">Rekap pendapatan, pemotongan beban operasional, dan sisa laci harian.</p>

                const unsubTx = onSnapshot(collection(db, 'transactions'), (snap) => {

                                <button onClick={() => setIsSidebarOpen(!isSidebarOpen)} className="p-2 -ml-2 rounded-xl text-slate-500 hover:bg-slate-100 hover:text-brand-600 transition-colors hidden md:block"><Icons.Menu size={22} /></button>
                                <button onClick={() => setIsSidebarOpen(true)} className="p-2 -ml-2 rounded-xl text-slate-500 hover:bg-slate-100 transition-colors md:hidden"><Icons.Menu size={22} /></button>
                                <div className="hidden sm:flex items-center"><h2 className="text-xs font-bold text-slate-500 flex items-center"><Icons.Clock size={12} className="mr-2 text-brand-500"/> {formatDate(today.toISOString())}</h2></div>
                            </div>
                        </header>

                        <div className="flex-1 relative w-full overflow-hidden">
                            <div className={`absolute inset-0 overflow-y-auto p-4 md:p-8 custom-scrollbar ${activeTab === 'beranda' ? 'block' : 'hidden'}`}><div className="max-w-6xl mx-auto"><Beranda stats={stats} transactions={transactions} setTab={setActiveTab} /></div></div>
                            <div className={`absolute inset-0 overflow-y-auto p-4 md:p-8 custom-scrollbar ${activeTab === 'input_harian' ? 'block' : 'hidden'}`}><div className="max-w-6xl mx-auto"><InputHarian addTransaction={addTransactionToCloud} showToast={showToast} /></div></div>
                            <div className={`absolute inset-0 overflow-y-auto p-4 md:p-8 custom-scrollbar ${activeTab === 'laporan' ? 'block' : 'hidden'}`}><div className="max-w-6xl mx-auto"><Laporan transactions={transactions} /></div></div>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
