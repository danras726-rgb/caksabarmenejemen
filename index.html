<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SateGule Management (Live Cloud)</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, updateDoc, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // Menyimpan library Firebase ke global window agar bisa dipakai oleh React/Babel
        window.FirebaseLib = { initializeApp, getFirestore, collection, onSnapshot, addDoc, updateDoc, doc, setDoc, deleteDoc, getAuth, signInAnonymously, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut };
    </script>

    <!-- Proteksi tampilan: matikan klik kanan, seleksi teks, salin/potong, dan drag konten -->
    <script>
        (function () {
            const isField = (el) => !!el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable);
            const block = (e) => { if (!isField(e.target)) e.preventDefault(); };
            ['contextmenu', 'selectstart', 'dragstart', 'copy', 'cut'].forEach((evt) => {
                document.addEventListener(evt, block, { capture: true });
            });
            document.addEventListener('keydown', (e) => {
                if (!(e.ctrlKey || e.metaKey) || isField(e.target)) return;
                if (['c', 'x', 'a', 'u', 's'].includes((e.key || '').toLowerCase())) e.preventDefault();
            }, { capture: true });
        })();
    </script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                        display: ['Fraunces', 'Georgia', 'serif']
                    },
                    colors: {
                        brand: { 50: '#f0fdfa', 100: '#ccfbf1', 200: '#99f6e4', 300: '#5eead4', 400: '#2dd4bf', 500: '#14b8a6', 600: '#0f766e', 700: '#0f6e6b', 800: '#115e59', 900: '#134e4a' },
                        cream: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0' },
                        ink: { 50: '#f8fafc', 100: '#e2e8f0', 400: '#94a3b8', 500: '#64748b', 700: '#334155', 800: '#1e293b', 900: '#0f172a' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-700 selection:bg-brand-400/25 overflow-hidden font-sans">
    <div id="root"></div>

    <script type="text/babel" src="script.js"></script>
</body>
</html>
